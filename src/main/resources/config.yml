## Supported transports: nethernet, raknet.
transport: nethernet
## Address on which the proxy accepts client connections.
proxy:
  host: 0.0.0.0
  port: 19122
## Destination server which the client will connect to.
destination:
  host: 127.0.0.1
  port: 19132
  signaling-scheme: auto
## Keep the identity key private. Disabling authentication allows unverified clients.
nethernet:
  identity-file: nethernet/identity.pem
  verify-client-authentication: true
## Maximum of clients which can connect to ProxyPass. If this should be disabled, set it to 0.
max-clients: 0
## Encode and decode packets to test protocol library for bugs
packet-testing: false
## Log packets for each session
log-packets: true
## Where to log packet data
## Valid options: console, file or both
log-to: file
## Should the client lie to the server about it's resource packs
ignore-resource-packs: false

## Packets to ignore to make your log more refined. These default packet are generally spammed
ignored-packets:
  - "NetworkStackLatencyPacket"
  - "LevelChunkPacket"
  - "MovePlayerPacket"
  - "PlayerAuthInputPacket"
  - "NetworkChunkPublisherUpdatePacket"
  - "ClientCacheBlobStatusPacket"
  - "ClientCacheMissResponsePacket"
## Packets to specifically block to and from the client, ensuring the server/client never receives these packets
blocked-packets: []

## Should ProxyPass use an authenticated account
online-mode: true
## Should ProxyPass save account login details
save-auth-details: true
## The default account name to use, if blank and multiple accounts are
## saved, the user will be forced to choose
default-account-name: ""
