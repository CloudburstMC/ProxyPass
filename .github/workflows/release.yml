name: Build Release

on:
  workflow_dispatch:
  push:
    branches:
      - "master"
    paths:
      - '**'
      - '!.gitignore'
      - '!LICENSE'
      - '!README.md'
      - '!.github/workflows/**'
      - '.github/workflows/release.yml'
  
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: 25
        distribution: temurin

    - name: Get previous build number
      id: getPreviousBuild
      run: | 
        PREVIOUS_TAG=$(git for-each-ref --sort=-version:refname --count 1 --format="%(refname:short)" "refs/tags/*")
        echo result=${PREVIOUS_TAG} >> $GITHUB_OUTPUT

    - name: Get current build number
      id: getCurrentBuild
      if: success()
      env:
        PREVIOUS_BUILD: ${{ steps.getPreviousBuild.outputs.result }}
      run: echo result=$((++PREVIOUS_BUILD)) >> $GITHUB_OUTPUT

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        gradle-home-cache-cleanup: true

    - name: Build
      run: ./gradlew build
      env:
        BUILD_NUMBER: ${{ steps.getCurrentBuild.outputs.result }}

    - uses: actions/upload-artifact@v7
      if: success()
      with:
        name: ProxyPass
        path: build/libs/ProxyPass.jar
        if-no-files-found: error

    - name: Generate release diff
      if: ${{ success() && github.ref_name == 'master' }}
      env:
        BEGIN_COMMIT: ${{ steps.getPreviousBuild.outputs.result }}
      run: |
        git fetch --tags --force
        # The new tag does not exist until the release step creates it, so end the range at HEAD.
        if [ -n "${BEGIN_COMMIT}" ]; then
          RANGE="${BEGIN_COMMIT}..HEAD"
        else
          RANGE="HEAD"
        fi
        git log --pretty=format:"* %s (%h)" ${RANGE} > release_notes.md

    - name: Create release
      uses: ncipollo/release-action@v1
      if: ${{ success() && github.ref_name == 'master' }}
      with:
        artifacts: "build/libs/ProxyPass.jar"
        allowUpdates: true
        bodyFile: "release_notes.md"
        draft: false
        prerelease: false
        name: Build ${{ steps.getCurrentBuild.outputs.result }} (${{ github.ref_name }})
        tag: ${{ steps.getCurrentBuild.outputs.result }}
        token: ${{ secrets.GITHUB_TOKEN }}
